name: cd

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  harborUser: robot$kigawa-net
  dockerRepository: harbor.kigawa.net/library
  name: fomage
  manifestRepository: kigawa-net/kigawa-net-k8s

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ env.harborUser }}
          password: ${{ secrets.HARBOR_PASS }}

      - uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: ${{ env.dockerRepository }}/${{ env.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PRを作成/更新するたびにdev環境へデプロイ
  deploy-dev:
    name: deploy to dev
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.manifestRepository }}
          ref: main
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update YAML File
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ env.dockerRepository }}/${{ env.name }}:${{ needs.build.outputs.tag }}"' \
            ./fonsole/dev/${{ env.name }}.yaml

      - name: push
        run: |
          git config user.name githubActions
          git config user.email bot@kigawa.net
          git add .
          git commit --author=. -m "deploy ${{ env.name }} ${{ needs.build.outputs.tag }} to dev"
          git push

  # mainへのpushでstg環境へデプロイ
  deploy-stg:
    name: deploy to stg
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.manifestRepository }}
          ref: main
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update YAML File
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ env.dockerRepository }}/${{ env.name }}:${{ needs.build.outputs.tag }}"' \
            ./fonsole/stg/${{ env.name }}.yaml

      - name: push
        run: |
          git config user.name githubActions
          git config user.email bot@kigawa.net
          git add .
          git commit --author=. -m "deploy ${{ env.name }} ${{ needs.build.outputs.tag }} to stg"
          git push

  # main上でのworkflow_dispatch(手動実行)でprod環境へデプロイ
  deploy-prod:
    name: deploy to prod
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.manifestRepository }}
          ref: main
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update YAML File
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ env.dockerRepository }}/${{ env.name }}:${{ needs.build.outputs.tag }}"' \
            ./fonsole/prod/${{ env.name }}.yaml

      - name: push
        run: |
          git config user.name githubActions
          git config user.email bot@kigawa.net
          git add .
          git commit --author=. -m "deploy ${{ env.name }} ${{ needs.build.outputs.tag }} to prod"
          git push
